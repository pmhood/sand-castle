name: Agent image

# Every third-party action below is pinned to a full commit SHA (with the version it resolves to
# in a trailing comment) rather than a mutable tag -- a job further down holds `packages: write`
# and pushes to a public registry, and a moved tag is code this repo never reviewed running with
# that scope. See .github/dependabot.yml for how the pins get updated, both automatically and by
# hand.

# `build`, `test` and `shellcheck` are required status checks on the protected `main`, so they
# must report on every pull request: GitHub treats a required check that never runs as still
# pending and blocks the merge, which is what a `paths:` filter on pull_request would cause for
# a change outside images/agent. The push trigger keeps its filter, because the only thing
# downstream of it is `publish`, which should republish the image when the image changes and
# not when something else does.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "images/agent/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build image
        run: docker build -t sandcastle-agent:ci images/agent

      - name: Tool versions resolve on PATH
        run: |
          docker run --rm --entrypoint bash sandcastle-agent:ci -c '
            set -euo pipefail
            id -u
            git --version
            jq --version
            node --version
            python3 --version
            claude --version
            codex --version
            command -v sandcastle-run
          '

      - name: Entrypoint fails fast without required environment
        run: |
          if docker run --rm sandcastle-agent:ci; then
            echo "expected a non-zero exit with no environment set"
            exit 1
          fi

      - name: Bootstrap pipeline works end-to-end with fake CLI
        run: |
          # Test that the bootstrap reaches the CLI successfully without real credentials.
          # Uses fixture repository and issue, and a fake CLI so we can assert successful
          # completion. This proves: environment validation, clone, branch creation,
          # issue fetch, and CLI invocation all work correctly.
          mkdir -p fixture/repos/octocat/Hello-World/issues
          echo '{"number":1,"title":"Fixture issue","body":"body","labels":[]}' \
            > fixture/repos/octocat/Hello-World/issues/1

          # Create fake CLI that succeeds (proving bootstrap reached the invocation point)
          mkdir -p fakebin
          cat > fakebin/claude <<'EOF'
          #!/bin/sh
          printf 'fake claude read the prompt\n'
          exit 0
          EOF
          chmod +x fakebin/claude

          docker run --rm \
            -v "$PWD/fixture:/fixture:ro" \
            -v "$PWD/fakebin:/fakebin:ro" \
            -e PATH=/fakebin:/usr/local/bin:/usr/bin:/bin \
            -e SANDCASTLE_RUN_ID=run-ci-$GITHUB_RUN_ID \
            -e GITHUB_REPOSITORY=octocat/Hello-World \
            -e GITHUB_ISSUE_NUMBER=1 \
            -e AGENT=claude \
            -e GITHUB_TOKEN=not-a-real-token \
            -e GITHUB_API_URL=file:///fixture \
            sandcastle-agent:ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Run shellcheck
        run: make -C images/agent lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Run the bootstrap test suite
        run: make -C images/agent test

  # Multi-arch build and push to GHCR, on merge to main only (docs/ARCHITECTURE.md §11, §20,
  # §36: the cluster's amd64 nodes need an image built for their architecture, not just the
  # developer's). This is the normal path; `make -C images/agent publish` is a human escape
  # hatch for exceptional cases, not a substitute for it -- a hand-published image can drift
  # from the commit that supposedly produced it.
  publish:
    needs: [build, test, shellcheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Compute the short-SHA tag
        # A permanent, per-commit tag alongside the moving `latest` one: once `latest` retags
        # to a newer digest, the digest it used to point at becomes untagged, and GHCR's
        # untagged-image retention can reap it. sha-<short-sha> keeps every published digest
        # referenceable and traceable back to its commit, which §20's "immutable image
        # digests" posture depends on.
        run: echo "SHA_TAG=sha-${GITHUB_SHA:0:7}" >>"$GITHUB_ENV"

      - name: Set up QEMU (linux/arm64 leg of the cross-build)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64

      - name: Set up buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Log in to GHCR
        # GITHUB_TOKEN is scoped to this run and never appears in argv: --password-stdin
        # keeps it out of the process table, same rule as everywhere else this repo talks to
        # a registry or a credential-bearing endpoint.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push linux/amd64 + linux/arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/pmhood/sandcastle-agent:latest \
            -t "ghcr.io/pmhood/sandcastle-agent:$SHA_TAG" \
            --push \
            images/agent

      - name: Record the published digest
        run: |
          {
            echo "### Published: ghcr.io/pmhood/sandcastle-agent:latest / :$SHA_TAG"
            echo
            echo '```'
            docker buildx imagetools inspect ghcr.io/pmhood/sandcastle-agent:latest
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
