# Binds server-role.yaml to sandcastle-server and nobody else (docs/ARCHITECTURE.md §22).
#
# RoleBinding, not ClusterRoleBinding: a RoleBinding only ever grants within the namespace it
# lives in, which is what keeps sandcastle-server's permissions off every other namespace the
# cluster has -- see server-role.yaml for why the Role it points at is namespaced too.
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sandcastle-server
  namespace: sandcastle-agents
  labels:
    app: sandcastle
subjects:
  - kind: ServiceAccount
    name: sandcastle-server
    namespace: sandcastle-agents
roleRef:
  kind: Role
  name: sandcastle-server
  apiGroup: rbac.authorization.k8s.io
