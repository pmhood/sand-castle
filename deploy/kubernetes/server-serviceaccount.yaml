# The Sand Castle server's identity in the agent namespace (docs/ARCHITECTURE.md §22, §37, §50).
#
# `sandcastle-server`, never `sandcastle-agent` with a suffix or a prefix: the two identities
# must never be confused with each other, because confusing them is how the agent -- untrusted
# code execution (§50) -- ends up with a path to the Kubernetes API. serviceaccount.yaml is the
# agent's, is deliberately alone (no Role, no RoleBinding), and its own header comment points
# here for where the server's permissions actually live.
#
# This ServiceAccount lives in sandcastle-agents because that is the only namespace this
# repository manages: §21's sandcastle-system arrives with the server workload itself, which
# does not exist yet (#53 is what will first read this identity). A RoleBinding's subject may
# name a ServiceAccount in a different namespace from the one it grants in, so nothing here
# needs to change when sandcastle-system and a Deployment for the server arrive.
#
# server-role.yaml and server-rolebinding.yaml are what actually grant this identity anything;
# on its own it can authenticate and authorize nothing, the same as a ServiceAccount with no
# binding always can't. server-role.yaml explains why the three are three files, not one.
#
# No `automountServiceAccountToken: false` here, unlike the agent's ServiceAccount. That field
# is what makes the agent's identity powerless even if bound to something (§50); this identity
# exists so the server *can* reach the Kubernetes API with it, so leaving automount at its
# default -- on -- is the point, not an oversight. Whatever Pod uses this ServiceAccount gets
# the token this Role's permissions apply to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandcastle-server
  namespace: sandcastle-agents
  labels:
    app: sandcastle
