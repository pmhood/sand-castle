# The identity an agent run gets, and deliberately nothing else (docs/ARCHITECTURE.md §22, §50).
#
# `automountServiceAccountToken: false` is the point of having a dedicated ServiceAccount at
# all: §50 says the agent must not automatically receive access to the Kubernetes API, and the
# `default` ServiceAccount every namespace ships with mounts its token into every Pod. This one
# mounts nothing, so there is no token in the container to steal, replay, or hand to a model.
#
# No Role and no RoleBinding accompany it, so even a token obtained some other way would
# authorize nothing in this namespace. The RBAC §22 describes belongs to the *server*, which
# creates and watches these Jobs from outside; it is not the agent's (Phase 3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandcastle-agent
  namespace: sandcastle-agents
  labels:
    app: sandcastle
automountServiceAccountToken: false
